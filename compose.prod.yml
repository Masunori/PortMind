services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      BACKEND_URL: http://server:8000
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-psa}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-psa}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?Set CLIENT_ORIGIN}
      CLIENT_GATEWAY_URL: ${CLIENT_GATEWAY_URL:?Set CLIENT_GATEWAY_URL}
      CLIENT_GATEWAY_TOKEN: ${CLIENT_GATEWAY_TOKEN:-}
      FILTER_PROVIDER: ${FILTER_PROVIDER:-stub}
      INTERPRETER_PROVIDER: ${INTERPRETER_PROVIDER:-stub}
      HYPOTHESIS_PROVIDER: ${HYPOTHESIS_PROVIDER:-stub}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      GEMINI_MAX_ATTEMPTS: ${GEMINI_MAX_ATTEMPTS:-3}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-30}
      BEDROCK_REGION: ${BEDROCK_REGION:-${AWS_REGION:-}}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-}
      BEDROCK_MAX_ATTEMPTS: ${BEDROCK_MAX_ATTEMPTS:-3}
      BEDROCK_SDK_MAX_ATTEMPTS: ${BEDROCK_SDK_MAX_ATTEMPTS:-2}
      BEDROCK_TIMEOUT_SECONDS: ${BEDROCK_TIMEOUT_SECONDS:-60}
      BEDROCK_MAX_TOKENS: ${BEDROCK_MAX_TOKENS:-4096}
      RISK_PROVIDER: ${RISK_PROVIDER:-stub}
      PLANNER_PROVIDER: ${PLANNER_PROVIDER:-stub}
      CLIENT_GATEWAY_TIMEOUT_SECONDS: ${CLIENT_GATEWAY_TIMEOUT_SECONDS:-10}
      CLIENT_GATEWAY_MAX_RETRIES: ${CLIENT_GATEWAY_MAX_RETRIES:-2}
      ENABLE_SOURCE_SCHEDULER: ${ENABLE_SOURCE_SCHEDULER:-false}
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-psa}
      POSTGRES_USER: ${POSTGRES_USER:-psa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_prod_data:
