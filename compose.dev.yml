services:
  dynamodb-local:
    image: amazon/dynamodb-local:2.6.1
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "8001:8000"
    profiles: ["dynamodb"]

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    environment:
      BACKEND_URL: http://server:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
      - client_next:/app/.next
    depends_on:
      server:
        condition: service_healthy

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    environment:
      PERSISTENCE_BACKEND: ${PERSISTENCE_BACKEND:-postgres}
      DYNAMODB_TABLE_NAME: ${DYNAMODB_TABLE_NAME:-psa-local}
      DYNAMODB_ENDPOINT_URL: ${DYNAMODB_ENDPOINT_URL:-http://dynamodb-local:8000}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      DATABASE_URL: postgresql+psycopg://psa:psa@database:5432/psa
      CLIENT_ORIGIN: http://localhost:3000
      CLIENT_GATEWAY_URL: ${CLIENT_GATEWAY_URL:?Set CLIENT_GATEWAY_URL to the demo client integration API}
      CLIENT_GATEWAY_TOKEN: ${CLIENT_GATEWAY_TOKEN:-}
      FILTER_PROVIDER: ${FILTER_PROVIDER:-stub}
      INTERPRETER_PROVIDER: ${INTERPRETER_PROVIDER:-stub}
      HYPOTHESIS_PROVIDER: ${HYPOTHESIS_PROVIDER:-stub}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      GEMINI_MAX_ATTEMPTS: ${GEMINI_MAX_ATTEMPTS:-3}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-30}
      BEDROCK_REGION: ${BEDROCK_REGION:-${AWS_REGION:-}}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-}
      BEDROCK_MAX_ATTEMPTS: ${BEDROCK_MAX_ATTEMPTS:-3}
      BEDROCK_SDK_MAX_ATTEMPTS: ${BEDROCK_SDK_MAX_ATTEMPTS:-2}
      BEDROCK_TIMEOUT_SECONDS: ${BEDROCK_TIMEOUT_SECONDS:-60}
      BEDROCK_MAX_TOKENS: ${BEDROCK_MAX_TOKENS:-4096}
      RISK_PROVIDER: ${RISK_PROVIDER:-stub}
      PLANNER_PROVIDER: ${PLANNER_PROVIDER:-stub}
      ENABLE_SOURCE_SCHEDULER: ${ENABLE_SOURCE_SCHEDULER:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: psa
      POSTGRES_USER: psa
      POSTGRES_PASSWORD: psa
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psa -d psa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  client_node_modules:
  client_next:
  postgres_dev_data:
