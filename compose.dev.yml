services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    environment:
      BACKEND_URL: http://server:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
      - client_next:/app/.next
    depends_on:
      server:
        condition: service_healthy

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgresql+psycopg://psa:psa@database:5432/psa
      CLIENT_ORIGIN: http://localhost:3000
      CLIENT_GATEWAY_URL: ${CLIENT_GATEWAY_URL:?Set CLIENT_GATEWAY_URL to the demo client integration API}
      CLIENT_GATEWAY_TOKEN: ${CLIENT_GATEWAY_TOKEN:-}
      FILTER_PROVIDER: ${FILTER_PROVIDER:-stub}
      INTERPRETER_PROVIDER: ${INTERPRETER_PROVIDER:-stub}
      HYPOTHESIS_PROVIDER: ${HYPOTHESIS_PROVIDER:-stub}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      GEMINI_MAX_ATTEMPTS: ${GEMINI_MAX_ATTEMPTS:-3}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-30}
      RISK_PROVIDER: ${RISK_PROVIDER:-stub}
      PLANNER_PROVIDER: ${PLANNER_PROVIDER:-stub}
      ENABLE_SOURCE_SCHEDULER: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: psa
      POSTGRES_USER: psa
      POSTGRES_PASSWORD: psa
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psa -d psa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  client_node_modules:
  client_next:
  postgres_dev_data:
