name: Backend tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:2.6.1
        ports:
          - 8001:8000
    env:
      DYNAMODB_LOCAL_ENDPOINT: http://127.0.0.1:8001
      MANAGE_DYNAMODB_LOCAL: "0"
      AWS_REGION: ap-southeast-1
      AWS_ACCESS_KEY_ID: localTestKey
      AWS_SECRET_ACCESS_KEY: localTestSecret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r server/requirements-dev.txt
      - name: Run all backend tests
        run: scripts/test-backend.sh
